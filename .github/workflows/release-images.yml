name: Publish container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish ChatGPT bridge image
        uses: docker/build-push-action@v6
        with:
          context: services/chatgpt-bridge
          push: true
          tags: |
            ghcr.io/s3tupw1zard/opencode-context-relay-chatgpt:${{ steps.version.outputs.version }}
            ghcr.io/s3tupw1zard/opencode-context-relay-chatgpt:latest
          labels: |
            org.opencontainers.image.source=https://github.com/s3tupw1zard/opencode-context-relay
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Publish migrator image
        uses: docker/build-push-action@v6
        with:
          context: database
          push: true
          tags: |
            ghcr.io/s3tupw1zard/opencode-context-relay-migrator:${{ steps.version.outputs.version }}
            ghcr.io/s3tupw1zard/opencode-context-relay-migrator:latest
          labels: |
            org.opencontainers.image.source=https://github.com/s3tupw1zard/opencode-context-relay
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
