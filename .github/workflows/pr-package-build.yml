name: PR npm package build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.allow.outputs.allowed }}
    steps:
      - id: allow
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXTRA_ALLOWED_ACTORS: ${{ vars.PR_PACKAGE_ALLOWED_ACTORS }}
        run: |
          set -euo pipefail
          allowed=false
          author="${PR_AUTHOR,,}"
          for candidate in s3tupw1zard ${EXTRA_ALLOWED_ACTORS//,/ }; do
            [[ -n "$candidate" ]] || continue
            if [[ "${candidate,,}" == "$author" ]]; then
              allowed=true
              break
            fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" != "true" ]]; then
            echo "::notice::Skipping PR package build for unapproved author $PR_AUTHOR"
          fi

  build:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: relay
            directory: packages/opencode-context-relay
            preview_name: "@s3tupw1zard/opencode-context-relay"
          - id: chatgpt
            directory: services/chatgpt-bridge
            preview_name: "@s3tupw1zard/opencode-context-relay-chatgpt"
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        if: matrix.id == 'relay'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify OpenCode relay
        if: matrix.id == 'relay'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          fi

      - name: Verify ChatGPT bridge
        if: matrix.id == 'chatgpt'
        working-directory: ${{ matrix.directory }}
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Prepare GitHub Packages preview
        working-directory: ${{ matrix.directory }}
        shell: bash
        env:
          PREVIEW_NAME: ${{ matrix.preview_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          preview_version="${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          PREVIEW_VERSION="$preview_version" node --input-type=module <<'NODE'
          import fs from "node:fs"
          const file = "package.json"
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
          pkg.name = process.env.PREVIEW_NAME
          pkg.version = process.env.PREVIEW_VERSION
          pkg.publishConfig = {
            ...(pkg.publishConfig ?? {}),
            registry: "https://npm.pkg.github.com",
          }
          delete pkg.publishConfig.access
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
          NODE

          pack_json="$(npm pack --ignore-scripts --json)"
          tarball="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(p[0].filename)' <<<"$pack_json")"
          mv "$tarball" "${RUNNER_TEMP}/${{ matrix.id }}.tgz"

          echo "Prepared $PREVIEW_NAME@$preview_version"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-npm-${{ matrix.id }}
          path: ${{ runner.temp }}/${{ matrix.id }}.tgz
          if-no-files-found: error
          retention-days: 7
