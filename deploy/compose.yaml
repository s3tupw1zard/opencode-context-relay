services:
  postgres:
    image: postgres:17
    container_name: context-bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context_bridge}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Recommended default: Docker-managed named volume.
      - postgres_data:/var/lib/postgresql/data

      # Alternative: bind mount for easier host-level inspection/migration.
      # Comment out the named volume above before enabling this line.
      # - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-context_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/s3tupw1zard/opencode-context-relay-migrator:${CONTEXT_RELAY_VERSION:-latest}
    pull_policy: always
    restart: "no"

    # Development alternative: build the migrator from a local clone.
    # build:
    #   context: ../database
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-context_bridge}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      CONTEXT_BRIDGE_WRITER_PASSWORD: ${CONTEXT_BRIDGE_WRITER_PASSWORD:?set CONTEXT_BRIDGE_WRITER_PASSWORD}
      CONTEXT_BRIDGE_READER_PASSWORD: ${CONTEXT_BRIDGE_READER_PASSWORD:?set CONTEXT_BRIDGE_READER_PASSWORD}
    # Development override: use migration files from a local clone.
    # volumes:
    #   - ../database:/database:ro

  chatgpt-bridge:
    image: ghcr.io/s3tupw1zard/opencode-context-relay-chatgpt:${CONTEXT_RELAY_VERSION:-latest}
    pull_policy: always

    # Development alternative: build the service from a local clone.
    # build:
    #   context: ../services/chatgpt-bridge

    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://context_bridge_reader:${CONTEXT_BRIDGE_READER_PASSWORD}@postgres:5432/${POSTGRES_DB:-context_bridge}
      DATABASE_SCHEMA: context_bridge
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8787
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-oauth}
      OAUTH_ISSUER: ${OAUTH_ISSUER:?set OAUTH_ISSUER}
      OAUTH_ALLOWED_SUBJECT: ${OAUTH_ALLOWED_SUBJECT:-}
      OAUTH_ALLOW_SHARED_BACKEND: ${OAUTH_ALLOW_SHARED_BACKEND:-false}
      MCP_TRUST_PROXY_MTLS: ${MCP_TRUST_PROXY_MTLS:-true}
      MCP_EXPECTED_OPENAI_SAN: ${MCP_EXPECTED_OPENAI_SAN:-mtls.prod.connectors.openai.com}
      STORAGE_TIMEOUT_MS: ${STORAGE_TIMEOUT_MS:-5000}
      STALE_AFTER_MS: ${STALE_AFTER_MS:-900000}
      STORAGE_MAX_ROWS: ${STORAGE_MAX_ROWS:-1000}
    ports:
      - "127.0.0.1:${MCP_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
