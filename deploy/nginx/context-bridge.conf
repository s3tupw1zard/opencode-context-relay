# Example site config. Replace context.example.com and certificate paths.
# This default assumes nginx itself accepts the public TLS connection.
# Do NOT add proxy_protocol unless an L4 proxy in front of nginx actually sends it.

upstream chatgpt_context_bridge {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name context.example.com;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/context.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/context.example.com/privkey.pem;

    # Bundle produced by scripts/update-openai-mtls-ca.sh.
    ssl_client_certificate /etc/nginx/mtls/openai-connectors-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/context-bridge-mtls.log context_bridge_mtls;

    if ($reject_missing_mtls) {
        return 403;
    }

    location / {
        proxy_pass http://chatgpt_context_bridge;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Always overwrite these at the trusted reverse proxy. The application
        # uses them for the SAN check after nginx validates the certificate chain.
        proxy_set_header X-OpenAI-MTLS-Verify $ssl_client_verify;
        proxy_set_header X-OpenAI-MTLS-Cert $ssl_client_escaped_cert;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
