# OpenCode Context Relay nginx boilerplate.
#
# Replace:
#   - context.example.com
#   - TLS certificate paths if they differ
#   - the upstream address if the bridge is not on this host
#
# This example assumes an L4 proxy in front of nginx sends PROXY protocol.
# If nginx receives public TLS connections directly, remove "proxy_protocol"
# from both listen directives and remove "real_ip_header proxy_protocol".
#
# IMPORTANT: when an L4 proxy sends PROXY protocol to nginx on :443, use
# proxy_protocol consistently on every nginx server block sharing that
# listener. Mixing PROXY-protocol and normal TLS listeners on the same
# address/port can break the other HTTPS sites.

upstream chatgpt_context_bridge {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 443 ssl proxy_protocol;
    listen [::]:443 ssl proxy_protocol;

    server_name context.example.com;

    # If you use nginx's realip module, also configure set_real_ip_from for
    # the actual trusted L4 proxy address/CIDR.
    real_ip_header proxy_protocol;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/context.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/context.example.com/privkey.pem;

    # Request the OpenAI client certificate, but do not require it during
    # OAuth/MCP discovery and initial unauthenticated probes.
    ssl_client_certificate /etc/nginx/mtls/openai-connectors-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/context-mtls.log mtls_debug;

    # Authenticated MCP requests must come with a successfully validated
    # OpenAI client certificate.
    if ($reject_missing_mtls) {
        return 403;
    }

    location / {
        proxy_pass http://chatgpt_context_bridge;

        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;

        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Always overwrite these at the trusted reverse proxy. The bridge
        # uses them for the SAN check after nginx validates the certificate.
        proxy_set_header X-OpenAI-MTLS-Verify $ssl_client_verify;
        proxy_set_header X-OpenAI-MTLS-Cert $ssl_client_escaped_cert;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
