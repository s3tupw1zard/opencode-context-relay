# Include this file inside nginx's http {} block.
# On Debian/Ubuntu, /etc/nginx/conf.d/*.conf is normally included there.

map $http_authorization $has_bearer_token {
    default      0;
    ~^Bearer\s+  1;
}

# Discovery and initial unauthenticated probes are allowed without a client
# certificate. Once ChatGPT presents a Bearer token, the TLS connection must
# also have a successfully verified OpenAI-managed client certificate.
map "$has_bearer_token:$ssl_client_verify" $reject_missing_mtls {
    default       0;
    "1:SUCCESS"   0;
    ~^1:           1;
}

log_format mtls_debug
    '$remote_addr - $host "$request" $status '
    'mtls=$ssl_client_verify '
    'subject="$ssl_client_s_dn" issuer="$ssl_client_i_dn"';
