services:
  context-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
